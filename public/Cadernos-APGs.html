  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #123328; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #123328; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
    #__bundler_loading { display: none !important; }
    #__bundler_thumbnail { background: linear-gradient(160deg,#123328,#1d5240) !important; }
    .apg-splash { display:flex; flex-direction:column; align-items:center; gap:22px; animation: apgSplashIn .6s cubic-bezier(.22,.61,.36,1) both; }
    .apg-splash-mark { display:flex; align-items:center; gap:12px; }
    .apg-splash-dot { width:14px; height:14px; border-radius:50%; background:#f4a52b; box-shadow:0 0 0 0 rgba(244,165,43,.5); animation: apgSplashPulse 1.4s ease-in-out infinite; }
    .apg-splash-word { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:800; font-size:1.7rem; letter-spacing:-.02em; color:#f7f4ec; }
    .apg-splash-bar { width:180px; height:4px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; }
    .apg-splash-bar i { display:block; width:40%; height:100%; border-radius:999px; background:#f4a52b; animation: apgSplashSlide 1.1s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes apgSplashIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
    @keyframes apgSplashPulse { 0%,100% { box-shadow:0 0 0 0 rgba(244,165,43,.5);} 50% { box-shadow:0 0 0 10px rgba(244,165,43,0);} }
    @keyframes apgSplashSlide { 0% { transform:translateX(-120%);} 100% { transform:translateX(320%);} }
    @media (prefers-reduced-motion: reduce){ .apg-splash, .apg-splash-dot, .apg-splash-bar i { animation:none !important;} }
  </style>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 * { box-sizing: border-box; }\n  :root {\n    --dg: #123328; --dg-2: #16402f; --dg-3: #1d5240; --green: #2f8462; --green-soft: #8fc9ac;\n    --orange: #f4a52b; --orange-deep: #d9861a; --orange-ink: #3a2400;\n    --paper: #f7f4ec; --paper-2: #efe9dc; --card: #ffffff; --cream: #efe7d3;\n    --ink: #16241d; --ink-soft: #52645a; --line: #e2dccd;\n    --e: cubic-bezier(.22,.61,.36,1); --e-in: cubic-bezier(.55,.06,.68,.19);\n    --disp: 'Bricolage Grotesque', system-ui, sans-serif;\n    --body: 'Instrument Sans', system-ui, sans-serif;\n    --serif: 'Instrument Serif', Georgia, serif;\n    --sh-sm: 0 2px 8px -3px rgba(18,51,40,.14);\n    --sh-md: 0 18px 44px -22px rgba(18,51,40,.34);\n    --sh-lg: 0 40px 90px -40px rgba(18,51,40,.5);\n  }\n  html, body { margin: 0; padding: 0; overflow-x: clip; }\n  body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n  a { color: var(--orange-deep); text-decoration: none; }\n  a:hover { color: var(--orange); }\n  ::selection { background: var(--orange); color: var(--orange-ink); }\n  h1, h2, h3 { font-family: var(--disp); font-weight: 700; letter-spacing: -.02em; line-height: 1.02; margin: 0; text-wrap: balance; }\n  p { margin: 0; text-wrap: pretty; }\n  [data-reveal] { opacity: 0; transform: translateY(30px); transition: opacity .8s var(--e), transform .8s var(--e); }\n  [data-reveal=\"in\"] { opacity: 1; transform: none; }\n  @keyframes marquee { to { transform: translateX(-50%); } }\n  @keyframes pulseGlow { 0%,100% { box-shadow: 0 14px 30px -10px rgba(244,165,43,.55); } 50% { box-shadow: 0 14px 44px -6px rgba(244,165,43,.85); } }\n  @keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(3%,-4%) scale(1.06); } }\n  @keyframes floatChip { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }\n  @keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }\n  @keyframes bookBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }\n  @keyframes floatSoft { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }\n  @keyframes apgCurtain { 0%, 46% { opacity: 1; } 100% { opacity: 0; } }\n  @keyframes apgEnterRise { from { opacity: 0; transform: translateY(9px) scale(.98); } to { opacity: 1; transform: none; } }\n  @keyframes apgFadeIn { from { opacity: 0; } to { opacity: 1; } }\n  \u002F* Entrada suave: cortina verde da marca dissolve e o conteúdo faz fade-in,\n     substituindo a antiga tela de carregamento. *\u002F\n  .apg-enter-curtain { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; background: linear-gradient(160deg, var(--dg), var(--dg-3)); pointer-events: none; animation: apgCurtain 1.15s var(--e) .05s forwards; }\n  .apg-enter-curtain img { height: 58px; width: auto; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); animation: apgEnterRise .7s var(--e) both; }\n  .apg-enter-curtain span { font-family: var(--disp); font-weight: 600; font-size: 1.02rem; letter-spacing: .06em; color: #cfe0d6; animation: apgEnterRise .7s var(--e) .1s both; }\n  #apg-app { animation: apgFadeIn .7s var(--e) both; }\n  @media (max-width: 640px) {\n    .apg-navactions { flex-basis: 100%; flex-wrap: nowrap !important; justify-content: space-between; gap: 8px; }\n    .apg-navpills { flex: 0 1 auto; min-width: 0; max-width: calc(100vw - 160px); overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }\n    .apg-navpills::-webkit-scrollbar { display: none; }\n    .apg-navpills button { flex: 0 0 auto; white-space: nowrap; }\n    .apg-navbuy { flex: 0 0 auto; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    [data-reveal] { opacity: 1; transform: none; transition: none; }\n    [data-marquee], [data-blob], [data-glow], [data-chip], [data-fxlogo], [data-bob], [data-soft] { animation: none !important; }\n    .apg-enter-curtain { animation: none; display: none; }\n    .apg-enter-curtain img, .apg-enter-curtain span { animation: none; }\n    #apg-app { animation: none; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"apg-app\" style=\"min-height:100vh;background:var(--paper);position:relative;overflow-x:clip;\">\n\n  <!-- Cortina de entrada (fade lindão que substitui a tela de loading) -->\n  <div class=\"apg-enter-curtain\" aria-hidden=\"true\">\n    <img src=\"{{ logo }}\" alt=\"\">\n    <span>{{ enterLabel }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- Overlay de transição entre telas -->\n  <div style=\"{{ overlayStyle }}\">\n    <img data-fxlogo=\"1\" src=\"{{ logo }}\" alt=\"\" style=\"height:74px;width:auto;animation:logoPulse 1s var(--e) infinite;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4));\">\n    <span style=\"font-family:var(--disp);font-weight:700;font-size:1.3rem;color:#eef4ef;letter-spacing:.04em;\">{{ fxLabel }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ NAV ============ -->\n  <header style=\"position:sticky;top:0;z-index:60;background:rgba(247,244,236,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:12px clamp(18px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;\">\n      <div style=\"display:flex;align-items:center;gap:11px;cursor:pointer;\" sc-camel-on-click=\"{{ back }}\">\n        <img src=\"{{ logo }}\" alt=\"DomineAqui\" style=\"height:38px;width:auto;display:block;filter:drop-shadow(0 3px 6px rgba(18,51,40,.25));\">\n        <div style=\"display:flex;flex-direction:column;line-height:1;\">\n          <span style=\"font-family:var(--disp);font-weight:700;font-size:1.18rem;color:var(--dg);letter-spacing:-.02em;\">DomineAqui<\u002Fspan>\n          <span style=\"font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px;\">Cadernos de APG<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"apg-navactions\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n        <sc-if value=\"{{ showProduct }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"apg-navpills\" style=\"display:flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px;\">\n            <sc-for list=\"{{ navPills }}\" as=\"np\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ np.go }}\" style=\"{{ np.style }}\">{{ np.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <a href=\"{{ checkoutUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"apg-navbuy\" style=\"background:var(--orange);color:var(--orange-ink);font-weight:700;font-size:.92rem;padding:10px 20px;border-radius:999px;box-shadow:var(--sh-sm);transition:transform .2s var(--e);white-space:nowrap;\" style-hover=\"transform:translateY(-2px);\">Comprar<\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ SELEÇÃO DE PERÍODO ============ -->\n  <sc-if value=\"{{ showSelection }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"position:relative;padding:clamp(60px,9vw,116px) 0 clamp(36px,5vw,64px);overflow:hidden;\">\n      <div data-blob=\"1\" style=\"position:absolute;top:-14%;right:-8%;width:min(52vw,620px);aspect-ratio:1;background:radial-gradient(circle at 40% 40%, rgba(47,132,98,.16), transparent 62%);filter:blur(10px);animation:floatBlob 14s var(--e) infinite;pointer-events:none;\"><\u002Fdiv>\n      <div data-blob=\"1\" style=\"position:absolute;bottom:-20%;left:-10%;width:min(44vw,520px);aspect-ratio:1;background:radial-gradient(circle at 60% 40%, rgba(244,165,43,.13), transparent 60%);filter:blur(8px);animation:floatBlob 18s var(--e) infinite reverse;pointer-events:none;\"><\u002Fdiv>\n      <div style=\"max-width:1000px;margin:0 auto;padding:0 clamp(18px,4vw,44px);position:relative;text-align:center;\">\n        <div data-reveal=\"\" style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(47,132,98,.1);border:1px solid rgba(47,132,98,.24);color:var(--dg);font-weight:600;font-size:.82rem;padding:8px 16px;border-radius:999px;margin-bottom:26px;\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:var(--green);\"><\u002Fspan>\n          Feito por quem vive o PBL — para quem cansou de estudar solto\n        <\u002Fdiv>\n        <h1 data-reveal=\"\" style=\"font-size:clamp(2.5rem,6.6vw,5rem);font-weight:800;color:var(--dg);max-width:16ch;margin:0 auto;\">Estude cada APG <span style=\"color:var(--orange-deep);\">exatamente<\u002Fspan> como ela foi planejada pra ser aprendida.<\u002Fh1>\n        <p data-reveal=\"\" style=\"font-size:clamp(1.05rem,2.1vw,1.3rem);color:var(--ink-soft);max-width:60ch;margin:26px auto 0;transition-delay:120ms;\">Escolha seu período e destrave o material mais completo para dominar todas as APGs, tutorias e provas do SOI — na ordem certa, sem lacunas.<\u002Fp>\n        <div data-reveal=\"\" style=\"margin-top:22px;color:var(--ink-soft);font-size:.9rem;transition-delay:200ms;\">↓ escolha abaixo<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:0 0 clamp(80px,10vw,130px);\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,44px);\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;\">\n          <sc-for list=\"{{ periods }}\" as=\"pd\" hint-placeholder-count=\"4\">\n            <div data-reveal=\"\" style=\"{{ pd.wrapStyle }}\">\n              <div data-tilt=\"{{ pd.tiltOn }}\" sc-camel-on-click=\"{{ pd.go }}\" style=\"{{ pd.cardStyle }}\" style-hover=\"{{ pd.hoverStyle }}\">\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;\">\n                  <span style=\"font-family:var(--disp);font-weight:800;font-size:2.6rem;color:{{ pd.numColor }};line-height:.9;\">{{ pd.n }}<span style=\"font-size:1rem;font-weight:600;vertical-align:super;\">º<\u002Fspan><\u002Fspan>\n                  <span style=\"{{ pd.badgeStyle }}\">{{ pd.status }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ pd.available }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"perspective:700px;height:118px;display:flex;align-items:center;margin-bottom:14px;\">\n                    <img src=\"{{ pd.capa }}\" alt=\"Capa {{ pd.soi }}\" style=\"height:112px;width:auto;border-radius:3px 5px 5px 3px;transform:rotateY(-20deg) rotateX(3deg);box-shadow:14px 18px 30px -14px rgba(18,51,40,.5);transition:transform .4s var(--e);\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ pd.disabled }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"height:118px;display:flex;align-items:center;margin-bottom:14px;\">\n                    <div style=\"height:112px;width:80px;border-radius:4px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:#b8c0b8;font-size:1.4rem;\">?<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <span style=\"font-family:var(--disp);font-weight:700;font-size:1.5rem;color:var(--dg);\">{{ pd.soi }}<\u002Fspan>\n                <span style=\"color:var(--ink-soft);font-size:.92rem;margin-top:6px;margin-bottom:22px;\">{{ pd.tag }}<\u002Fspan>\n                <div style=\"margin-top:auto;\">\n                  <sc-if value=\"{{ pd.available }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"width:100%;text-align:center;background:var(--orange);color:var(--orange-ink);font-weight:700;font-size:1rem;padding:14px;border-radius:14px;box-shadow:var(--sh-sm);\">Quero conhecer →<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ pd.disabled }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"width:100%;text-align:center;background:var(--paper-2);color:#9aa39c;font-weight:600;font-size:.95rem;border:1px solid var(--line);padding:14px;border-radius:14px;\">Em desenvolvimento<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(20px,4vw,54px);margin-top:56px;padding-top:40px;border-top:1px solid var(--line);\">\n          <div style=\"text-align:center;\"><div style=\"font-family:var(--disp);font-weight:800;font-size:2rem;color:var(--dg);\">6.700+<\u002Fdiv><div style=\"color:var(--ink-soft);font-size:.85rem;\">páginas de conteúdo<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"font-family:var(--disp);font-weight:800;font-size:2rem;color:var(--dg);\">82<\u002Fdiv><div style=\"color:var(--ink-soft);font-size:.85rem;\">APGs mapeadas<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"font-family:var(--disp);font-weight:800;font-size:2rem;color:var(--dg);\">1.540+<\u002Fdiv><div style=\"color:var(--ink-soft);font-size:.85rem;\">exercícios<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"font-family:var(--disp);font-weight:800;font-size:2rem;color:var(--orange-deep);\">4,9<span style=\"font-size:1rem;\">\u002F5<\u002Fspan><\u002Fdiv><div style=\"color:var(--ink-soft);font-size:.85rem;\">nota dos alunos<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ PÁGINA DO PRODUTO ============ -->\n  <sc-if value=\"{{ showProduct }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <!-- HERO -->\n    <section data-hero=\"1\" style=\"position:relative;background:linear-gradient(168deg,var(--dg) 0%,var(--dg-2) 60%,var(--dg-3) 130%);color:#eef4ef;overflow:hidden;padding:clamp(48px,7vw,88px) 0 clamp(56px,8vw,104px);\">\n      <div data-blob=\"1\" style=\"position:absolute;top:-25%;right:-12%;width:min(60vw,720px);aspect-ratio:1;background:radial-gradient(circle at 45% 45%, rgba(244,165,43,.2), transparent 60%);filter:blur(8px);animation:floatBlob 16s var(--e) infinite;pointer-events:none;\"><\u002Fdiv>\n      <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,44px);position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(30px,5vw,64px);align-items:center;\">\n        <div data-reveal=\"\">\n          <div style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(143,201,172,.14);border:1px solid rgba(143,201,172,.3);color:var(--green-soft);font-weight:600;font-size:.8rem;padding:7px 15px;border-radius:999px;margin-bottom:22px;\">Caderno APG · {{ soi }} · {{ apgCount }} APGs<\u002Fdiv>\n          <h1 style=\"font-size:clamp(2.2rem,5vw,3.7rem);font-weight:800;color:#fff;max-width:15ch;\">{{ headline }}<\u002Fh1>\n          <p style=\"font-size:clamp(1.02rem,1.8vw,1.22rem);color:#c4d6cb;max-width:46ch;margin-top:20px;\">{{ sub }}<\u002Fp>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;\">\n            <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:9px 15px;border-radius:12px;font-size:.9rem;\"><span style=\"font-weight:700;color:#fff;\">{{ pagesFmt }}<\u002Fspan><span style=\"color:#a9c0b3;\">páginas<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ hasExercises }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:9px 15px;border-radius:12px;font-size:.9rem;\"><span style=\"font-weight:700;color:#fff;\">{{ exercisesFmt }}<\u002Fspan><span style=\"color:#a9c0b3;\">exercícios<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ interactive }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(244,165,43,.16);border:1px solid rgba(244,165,43,.4);color:#ffd591;padding:9px 15px;border-radius:12px;font-size:.9rem;font-weight:600;\">✦ Experiência Interativa<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- Preço -->\n          <div style=\"margin-top:30px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 24px;max-width:440px;\">\n            <div style=\"display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;\">\n              <div style=\"display:flex;flex-direction:column;\">\n                <sc-if value=\"{{ hasDiscount }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"color:#9fb8ab;font-size:.85rem;text-decoration:line-through;\">{{ originalFmt }}<\u002Fspan>\n                <\u002Fsc-if>\n                <div style=\"display:flex;align-items:baseline;gap:2px;\"><span style=\"font-size:1.1rem;font-weight:600;color:#fff;\">R$<\u002Fspan><span style=\"font-family:var(--disp);font-weight:800;font-size:3rem;color:#fff;line-height:1;\">{{ priceInt }}<\u002Fspan><span style=\"font-size:1.2rem;font-weight:700;color:#fff;\">,{{ priceCents }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasDiscount }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"background:var(--orange);color:var(--orange-ink);font-weight:800;font-size:.95rem;padding:6px 12px;border-radius:10px;margin-bottom:6px;\">-{{ discountPct }}%<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:#c4d6cb;font-size:.9rem;\">\n              <span>ou {{ installment }}<\u002Fspan>\n              <sc-if value=\"{{ hasDiscount }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"color:#ffd591;\">● {{ lote }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;\">\n              <a href=\"{{ checkoutUrl }}\" target=\"_blank\" rel=\"noopener\" data-glow=\"1\" style=\"flex:1;min-width:180px;text-align:center;background:var(--orange);color:var(--orange-ink);font-weight:800;font-size:1.05rem;padding:15px 22px;border-radius:14px;animation:pulseGlow 3s var(--e) infinite;transition:transform .2s var(--e);\" style-hover=\"transform:translateY(-2px);\">Comprar agora →<\u002Fa>\n              <button sc-camel-on-click=\"{{ goContent }}\" style=\"background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);color:#fff;font-family:var(--body);font-weight:600;font-size:1rem;padding:15px 22px;border-radius:14px;cursor:pointer;transition:background .2s var(--e);\" style-hover=\"background:rgba(255,255,255,.16);\">Ver conteúdo<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goPreview }}\" style=\"background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);color:#fff;font-family:var(--body);font-weight:600;font-size:1rem;padding:15px 22px;border-radius:14px;cursor:pointer;transition:background .2s var(--e);\" style-hover=\"background:rgba(255,255,255,.16);\">Ver prévia<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goReviews }}\" style=\"display:flex;align-items:center;gap:10px;margin-top:16px;color:#c4d6cb;font-size:.9rem;cursor:pointer;\">\n            <span style=\"color:var(--orange);letter-spacing:2px;\">★★★★★<\u002Fspan>\n            <span><strong style=\"color:#fff;\">{{ statAvg }}<\u002Fstrong> · {{ statTotal }} avaliações de estudantes reais<\u002Fspan>\n ata-reveal=\"\" style=\"text-align:center;margin-bottom:44px;\">\n          <span style=\"font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--green);\">o que tem dentro<\u002Fspan>\n          <h2 style=\"font-size:clamp(1.9rem,4vw,3rem);color:var(--dg);margin-top:8px;\">As {{ apgCount }} APGs de {{ soi }}, na ordem exata.<\u002Fh2>\n          <p style=\"color:var(--ink-soft);margin-top:12px;\">Aqui não paramos nos objetivos gerais: abrimos cada um em objetivos específicos. Toque numa APG para ver como cobrimos.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position:relative;\">\n          <div style=\"position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--green),var(--orange));opacity:.4;\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <sc-for list=\"{{ apgs }}\" as=\"apg\" hint-placeholder-count=\"8\">\n              <div data-reveal=\"\" style=\"position:relative;padding-left:52px;\">\n                <div style=\"position:absolute;left:8px;top:16px;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--green);color:var(--dg);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;font-family:var(--disp);z-index:1;\">{{ apg.num }}<\u002Fdiv>\n                <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-sm);\">\n                  <button sc-camel-on-click=\"{{ apg.toggle }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px;font-family:var(--body);\">\n                    <span style=\"font-family:var(--disp);font-weight:700;font-size:1.02rem;color:var(--dg);flex:1;line-height:1.25;\">{{ apg.title }}<\u002Fspan>\n                    <span style=\"{{ apg.caretStyle }}\">+<\u002Fspan>\n                  <\u002Fbutton>\n
