name: Disparar e-mails agendados

# Dispara o processamento dos e-mails agendados a cada ~5 minutos.
# Necessário porque o plano Vercel Hobby só executa Vercel Cron 1x/dia.
# O GitHub Actions é gratuito e bate no endpoint protegido por CRON_SECRET.
#
# Configuração necessária (uma vez):
#   1. Repo > Settings > Secrets and variables > Actions:
#        - CRON_SECRET  -> mesmo valor da env var CRON_SECRET no Vercel
#        - APP_URL      -> ex.: https://domineaqui.com.br
#
# Observação: o agendamento do GitHub Actions pode atrasar alguns minutos em
# horários de pico. Para precisão de ~1 min, use também um serviço como
# cron-job.org apontando para o mesmo endpoint com o header Authorization.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de envio
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ] || [ -z "${{ secrets.APP_URL }}" ]; then
            echo "CRON_SECRET ou APP_URL não configurados nos secrets do repositório."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/scheduled-emails-sender")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          if [ "$code" != "200" ]; then
            exit 1
          fi
